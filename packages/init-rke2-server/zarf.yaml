# Zarf init package for RKE2 airgapped deployment

kind: ZarfPackageConfig
metadata:
  name: init-rke2-server
  description: RKE2 airgap init package for server deployment
  version: "0.1.0"
  authors:
    - name: RKE2 Airgap Team

variables:
  - name: RKE2_VERSION
    description: RKE2 version to install
    default: "v1.35.1+rke2r1"

  - name: ARCH
    description: Target architecture
    default: "amd64"

  - name: SYSTEM_DEFAULT_REGISTRY
    description: Private registry URL for airgap deployment

  - name: RKE2_CONFIG_YAML
    description: RKE2 configuration as YAML string

  - name: INSTALL_DIR
    description: Installation directory for tarball method
    default: "/usr/local"

  - name: DATA_DIR
    description: RKE2 data directory
    default: "/var/lib/rancher/rke2"

  - name: SERVER_URL
    description: First server URL for joining cluster
    default: "https://127.0.0.1:9345"

  - name: JOIN_TOKEN
    description: Token for joining cluster
    sensitive: true

  - name: CLUSTER_Cidr
    description: Pod network CIDR
    default: "10.42.0.0/16"

  - name: SERVICE_CIDR
    description: Service network CIDR
    default: "10.43.0.0/16"

components:
  - name: rke2-binaries
    required: true
    description: RKE2 binaries and systemd units
    files:
      - source: ../files/rke2.linux-amd64.tar.gz
        destination: rke2.linux-amd64.tar.gz
      - source: ../files/rke2.linux-arm64.tar.gz
        destination: rke2.linux-arm64.tar.gz

  - name: rke2-images
    required: true
    description: RKE2 container images
    images:
      - rancher/rke2-runtime:v1.35.1-rke2r1
      - rancher/rke2-runtime:v1.34.4-rke2r1
      - rancher/rke2-runtime:v1.33.1-rke2r1

  - name: rke2-install-playbook
    required: true
    description: Ansible playbook for RKE2 installation
    manifests:
      - name: rke2-install
        path: ../files/ansible/playbooks/install.yml
        namespace: rke2-system

  - name: rke2-server-config
    required: true
    description: RKE2 server configuration templates
    files:
      - source: ../files/config/server-config.yaml
        destination: server-config.yaml

  - name: rke2-registries-config
    required: false
    description: Private registry configuration
    files:
      - source: ../files/config/registries.yaml
        destination: registries.yaml

  - name: rke2-selinux-policy
    required: false
    description: SELinux policy for RKE2 (RHEL-based systems)
    files:
      - source: ../files/rpms/rke2-selinux-policy.rpm
        destination: rke2-selinux-policy.rpm

# Package flavors for different deployment scenarios
flavors:
  server:
    description: Deploy first RKE2 server node (cluster initialization)
    # Uses default variables for first server

  server-join:
    description: Join additional RKE2 server to existing cluster
    variables:
      - name: JOIN_TOKEN
      - name: SERVER_URL
    # Requires join token and server URL

  agent:
    description: Join RKE2 agent to existing cluster
    variables:
      - name: JOIN_TOKEN
      - name: SERVER_URL
    # Requires join token and server URL

actions:
  on-deploy:
    - description: Extract RKE2 binary
      cmd: tar -xzf rke2.linux-{{ .Arch }}.tar.gz -C {{ .Variable.INSTALL_DIR }}

    - description: Configure registries
      cmd: cp registries.yaml {{ .Variable.DATA_DIR }}/agent/images/registries.yaml
      when: .Variable.SYSTEM_DEFAULT_REGISTRY != ""

    - description: Configure RKE2
      cmd: cp server-config.yaml /etc/rancher/rke2/config.yaml

    - description: Start RKE2 service
      cmd: systemctl enable rke2-server && systemctl start rke2-server