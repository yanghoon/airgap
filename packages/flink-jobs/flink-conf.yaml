taskmanager.numberOfTaskSlots: 1
parallelism.default: 1

execution.checkpointing.mode: EXACTLY_ONCE
execution.checkpointing.interval: 10s
execution.checkpointing.min-pause: 5s
execution.checkpointing.max-concurrent-checkpoints: 1

pipeline.default-kryo-serializers: class:org.apache.iceberg.GenericDataFile,serializer:com.esotericsoftware.kryo.serializers.JavaSerializer;class:org.apache.iceberg.GenericManifestFile,serializer:com.esotericsoftware.kryo.serializers.JavaSerializer

rest.port: 8081
