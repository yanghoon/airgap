apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: slim-kafka-print-job
  namespace: flink-job
spec:
  image: slim-kafka-print-job
  flinkVersion: v1_20
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: 1
    parallelism.default: 1

  ingress:
    tempalte: flink.local/{{namespace}}/{{name}}(/|$)(.*)
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /$2

  serviceAccount: flink
  podTemplate:
    metadata:
      labels:
        zarf.dev/agent: ignore
    spec:
      containers:
        - name: flink-main-container
          envFrom:
            - configMapRef:
                name: slim-kafka-print-job-env
          volumeMounts:
            - name: config-volume
              mountPath: /opt/flink/config
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: slim-kafka-print-job-config

  jobManager:
    replicas: 1
    resource:
      cpu: 1
      memory: 1024m
  taskManager:
    replicas: 1
    resource:
      cpu: 1
      memory: 1024m

  job:
    jarURI: local:///opt/flink/usrlib/app.jar
    entryClass: io.slim.flink.KafkaPrintJob
    state: running