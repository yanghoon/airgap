apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: slim-kafka-print-job
  namespace: flink-job
spec:
  image: slim-kafka-print-job

  flinkVersion: v1_20
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: 1
    parallelism.default: 1

    # for Task Manager HA
    restart-strategy.type: exponential-delay
    restart-strategy.exponential-delay.initial-backoff: 10s
    restart-strategy.exponential-delay.max-backoff: 1m
    # restart-strategy.exponential-delay.backoff-multiplier: 2.0
    # restart-strategy.exponential-delay.jitter-factor: 0.1

    # for Kafka ACK
    execution.checkpointing.mode: EXACTLY_ONCE
    execution.checkpointing.interval: 10s
    execution.checkpointing.min-pause: 5s
    execution.checkpointing.max-concurrent-checkpoints: 1

    pipeline.default-kryo-serializers: class:org.apache.iceberg.GenericDataFile,serializer:com.esotericsoftware.kryo.serializers.JavaSerializer;class:org.apache.iceberg.GenericManifestFile,serializer:com.esotericsoftware.kryo.serializers.JavaSerializer

  ingress:
    template: flink.local/{{namespace}}/{{name}}(/|$)(.*)
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /$2

  serviceAccount: flink-sa
  podTemplate:
    metadata:
      labels:
        zarf.dev/agent: ignore
    spec:
      containers:
        - name: flink-main-container
          envFrom:
            - configMapRef:
                name: slim-kafka-print-job-env
            - secretRef:
                name: slim-kafka-print-job-sec
          volumeMounts:
            - name: config-volume
              mountPath: /opt/flink/config
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: slim-kafka-print-job-config

  jobManager:
    replicas: 1
    resource:
      cpu: 1
      memory: 1024m
  taskManager:
    replicas: 1
    resource:
      cpu: 1
      memory: 1024m

  job:
    jarURI: local:///opt/flink/usrlib/app.jar
    entryClass: io.slim.flink.KafkaPrintJob
    state: running