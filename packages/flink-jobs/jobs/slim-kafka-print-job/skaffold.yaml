        #   # - ../settings.gradle
        #   # - ../jobs/slim-kafka-print-job/build.gradle
        #   # - ../jobs/slim-kafka-print-job/src/**/*
      # VER #1
      # context: ..
      # docker:
      #   dockerfile: slim-kafka-print-job/Dockerfile
      # VER #2
      # hooks:
      #   before:
      #     - command: ["./gradlew", ":slim-kafka-print-job:clean", ":slim-kafka-print-job:shadowJar"]

manifests:
  rawYaml:
    - manifests/*.yaml

resourceSelector:
  allow:
    - groupKind: FlinkDeployment.flink.apache.org
      image: [".*"]
