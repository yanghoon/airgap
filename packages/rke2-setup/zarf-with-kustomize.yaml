        #   - cmd: |
        #       # 1. 파일 내용 읽기 및 JSON 패치 생성
        #       # yq의 load_str은 파일 내의 특수문자와 줄바꿈을 JSON 규격에 맞게 자동 이스케이프합니다.
        #       PATCH_JSON=$(zarf tools yq -n '.data["config.json"] = load_str("manifests/local-path-provisioner/config.json")' -o json)
              
        #       # 2. kubectl patch 실행
        #       kubectl patch configmap local-path-config --type merge -p "$PATCH_JSON"
        #   - cmd: |
        #       kubectl rollout restart deployment/local-path-provisioner -n local-path-storage
        #   - cmd: |
        #       kubectl wait --for=condition=available --timeout=60s deployment/local-path-provisioner -n local-path-storage

