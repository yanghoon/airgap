apiVersion: zarf.dev/v1alpha1
kind: ZarfPackageConfig
metadata:
  name: rke2-setup
  description: "온프레미스 고정 노드 환경을 위한 로컬 스토리지 프로비저너 패키지"
  version: "v0.0.1"
  architecture: amd64

# 패키지 설치 시 사용자로부터 SSD 마운트 경로를 입력받을 수 있도록 상수로 정의
# constants:
#   - name: LOCAL_PATH_PROVISIONER_VERSION
#     description: "Local Path Provisioner의 버전"
#     value: "v0.0.35"

variables:
  - name: DEFAULT_PATH_FOR_NON_LISTED_NODES 
    description: "노드 목록에 없는 노드에 대한 기본 경로 (예: SSD가 마운트된 경로)"
    default: "/data"
    # prompt: true

components:
  - name: provisioner-core
    required: true
    description: "Local Path Provisioner 컨트롤러 및 관련 리소스"
    
    # 폐쇄망 환경에서 필요한 이미지들을 사전 정의하여 Zarf가 미러링하도록 함
    # images:
    #   - rancher/local-path-provisioner:v0.0.35
    #   - busybox:1.36  # Helper Pod용 이미지

    # 매니페스트 배포
    manifests:
      - name: local-path-storage
        namespace: local-path-storage
    #     files:
    #       - https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.35/deploy/local-path-storage.yaml
        kustomizations:
          - .
          # - manifests/local-path-privisioner/config.json
        
        # 매니페스트 내의 경로 설정을 사용자가 입력한 STORAGE_PATH로 치환
        # configmapAndSecretOverrides:
        #   - name: local-path-config
        #     key: config.json
        #     value: |
        #       {
        #         "nodePathMap": [
        #           {
        #             "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
        #             "paths": ["###ZARF_CONST_DEFAULT_Path_FOR_NON_LISTED_NODES###"]
        #           }
        #         ]
        #       }
    files:
      - source: https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.35/deploy/local-path-storage.yaml
        target: local-path-storage.yaml
      - source: ./manifests/local-path-privisioner/config.json
        target: config.json

    # 설치 전/후 스크립트 (권한 설정 등)
    actions:
      onDeploy:
        before:
          - cmd: |
              echo 'Starting deployment of local-path-provisioner to ###ZARF_VAR_DEFAULT_PATH_FOR_NON_LISTED_NODES###'
          # - cmd: |
          #     cat manifests/local-path-provisioner/config.json
