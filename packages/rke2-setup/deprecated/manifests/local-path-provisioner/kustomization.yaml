apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- local-path-storage.yaml

configMapGenerator:
- name: local-path-config
  namespace: local-path-storage
  behavior: merge
  files:
  - config.json=config.json

patches:
  - patch: |-
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: local-path
      spec: 
        reclaimPolicy: Retain

  # - target:
  #     kind: StorageClass
  #     name: local-path       # 원본 YAML의 StorageClass 이름과 일치해야 함
  #   patch: |-
  #     - op: replace
  #       path: /reclaimPolicy
  #       value: Retain
