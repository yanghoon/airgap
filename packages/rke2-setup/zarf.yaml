apiVersion: zarf.dev/v1alpha1
kind: ZarfPackageConfig
metadata:
  name: rke2-setup
  description: ""
  version: v0.0.1

components:
  - name: rancher-local-path-provisioner
    required: true
    actions:
      onCreate:
        # [Step 1] 패키지 생성 전: 명시적 파일명으로 이미지 추출
        before:
          - cmd: |
              ./zarf tools registry pull rancher/local-path-provisioner:v0.0.35 \
                local-path-provisioner-v0.0.35.tar --format=tarball
          - cmd: |
              ./zarf tools registry pull busybox:1.36 \
                busybox-1.36.tar --format=tarball
        
        # [Step 3] 패키지 생성 후: 생성했던 특정 파일만 정확히 삭제
        after:
          - cmd: rm local-path-provisioner-v0.0.35.tar
          - cmd: rm busybox-1.36.tar

    # [Step 2] 패키징 및 타겟 배포 경로 정의
    # Zarf는 소스 파일이 존재하는지 검증한 후 패키지에 포함시킵니다.
    files:
      - source: local-path-provisioner-v0.0.35.tar
        target: /var/lib/rancher/rke2/agent/images/local-path-provisioner-v0.0.35.tar
      - source: busybox-1.36.tar
        target: /var/lib/rancher/rke2/agent/images/busybox-1.36.tar
    
    charts:
      - name: local-path-provisioner
        version: v0.0.35
        namespace: local-path-storage
        url: https://github.com/rancher/local-path-provisioner.git
        gitPath: deploy/chart/local-path-provisioner
        valuesFiles:
          - values-local-path-provisioner.yaml
