    #   store_raw_request_response: true
    #   custom_provider_config:
    #     base_provider_type: "openai"
    #     allowed_requests:
    #       embedding: true
    #   network_config:
    #     base_url: "http://tei-embedding/"
    #   keys:
    #     - name: "embedding"
    #       value: "dummy-api-key"
    #       weight: 1
    #       models: ["*"]
    #       aliases:
    #         "embedding/multilingual-e5-small": "intfloat/multilingual-e5-small"

  authConfig:
    disableAuthOnInference: true
    adminUsername: admin
    adminPassword: password123
