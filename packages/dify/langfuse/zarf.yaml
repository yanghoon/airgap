kind: ZarfPackageConfig
metadata:
  name: langfuse
  version: "1.5.35"
  description: "Zarf package for Langfuse LLM Observability Platform (Official Helm Chart)"

components:
  - name: langfuse
    required: true
    description: "Langfuse Core Services and Data Stores (Postgres, Clickhouse, Redis, MinIO)"
    charts:
      - name: langfuse
        url: https://langfuse.github.io/langfuse-k8s
        version: "1.5.35"
        namespace: langfuse
        releaseName: langfuse
        valuesFiles:
          - values-langfuse.yaml
    images:
      - docker.io/bitnamilegacy/clickhouse:25.2.1-debian-12-r0
      - docker.io/bitnamilegacy/minio:2024.12.18-debian-12-r1
      - docker.io/bitnamilegacy/postgresql:17.3.0-debian-12-r1
      - docker.io/bitnamilegacy/valkey:8.0.2-debian-12-r2
      - docker.io/bitnamilegacy/zookeeper:3.9.3-debian-12-r8
      - langfuse/langfuse-worker:3.185.0
      - langfuse/langfuse:3.185.0
