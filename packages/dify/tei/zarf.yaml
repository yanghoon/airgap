kind: ZarfPackageConfig
metadata:
  name: tei-embedding
  version: 1.14.1

components:
  - name: tei-embedding
    required: false
    manifests:
      - name: tei-downloader
        namespace: dify
        files:
          - tei-downloader-daemonset.yaml
    charts:
      - name: text-embeddings-inference
        url: https://infracloudio.github.io/charts/
        version: 0.1.8
        namespace: dify
        valuesFiles:
          - tei-values.yaml
    images:
      - ghcr.io/huggingface/text-embeddings-inference:cpu-latest
      - ghcr.io/oras-project/oras:latest
