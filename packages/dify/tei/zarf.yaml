kind: ZarfPackageConfig
metadata:
  name: tei-embedding
  version: 1.14.1

components:
  - name: tei-embedding
    required: false
    manifests:
      - name: tei-pvc
        namespace: dify
        files:
          - tei-pvc.yaml
    charts:
      - name: text-embeddings-inference
        url: https://infracloudio.github.io/charts/
        version: 0.1.8
        namespace: dify
        valuesFiles:
          - tei-values.yaml
    images:
      - ghcr.io/huggingface/text-embeddings-inference:cpu-latest
