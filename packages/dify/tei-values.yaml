image:
  repository: ghcr.io/huggingface/text-embeddings-inference
  tag: cpu-latest

config:
  # 모델이 /data 경로에 오프라인 형태로 제공된다고 가정합니다.
  modelID: /data/models/intfloat/multilingual-e5-small

ingress:
  enabled: true
  className: ""
  annotations:
    kubernetes.io/ingress.class: nginx
  hosts:
    - host: text-embedding.local
      paths:
        - path: /
          pathType: ImplementationSpecific

volumes:
  - name: model-data
    persistentVolumeClaim:
      claimName: tei-model-pvc

volumeMounts:
  - name: model-data
    mountPath: /data
