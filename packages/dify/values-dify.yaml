# Global Configuration
global:
  host: "dify.local"        # 접속 도메인 설정
  enableTLS: false          # 서비스 간/외부 통신 TLS 비활성화

# Ingress Configuration
ingress:
  enabled: true
  className: "nginx"        # RKE2/K8s 환경에 설치된 ingress controller 클래스
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # 에어갭 환경에서 큰 파일(모델 등) 업로드를 고려한 설정
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
  tls: []                   # TLS 미사용 (비워둠)

# Image Configuration (v0.12.1 App Version 기준)
# 에어갭 배포 시 Zarf가 이 태그를 참조하여 이미지를 패키징합니다.
# api:
#   image:
#     repository: langgenius/dify-api
#     tag: "0.12.1"
# worker:
#   image:
#     repository: langgenius/dify-api
#     tag: "0.12.1"
# web:
#   image:
#     repository: langgenius/dify-web
#     tag: "0.12.1"
# sandbox:
#   image:
#     repository: langgenius/dify-sandbox
#     tag: "0.0.6"

# Dependencies (Internal)
# 운영 환경에서는 이 섹션을 false로 바꾸고 외부(Managed) 서비스를 연결하는 것이 권장됩니다.
postgresql:
  enabled: true
  persistence:
    enabled: true
    size: 10Gi

redis:
  enabled: true

weaviate:
  enabled: true
  persistence:
    enabled: true
    size: 20Gi

# Node Selector / Affinity (필요 시 주석 해제하여 사용)
