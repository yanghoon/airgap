kind: ZarfPackageConfig
metadata:
  name: dify-boris-community
  description: "Dify LLM platform (BorisPolonsky community chart)"
  version: 0.36.0

components:
  - name: dify-stack
    required: true
    charts:
      - name: dify
        releaseName: dify
        url: https://borispolonsky.github.io/dify-helm/
        version: 0.36.0
        namespace: dify-system
        valuesFiles:
          - values-dify.yaml

    # 에어갭 환경을 위한 컨테이너 이미지 번들링
    images:
      - cr.weaviate.io/semitechnologies/weaviate:1.27.27
      - docker.io/alpine:latest
      - docker.io/bitnamilegacy/postgresql:15.3.0-debian-11-r7
      - docker.io/bitnamilegacy/redis:7.0.11-debian-11-r12
      - langgenius/dify-api:1.12.1
      - langgenius/dify-plugin-daemon:0.5.3-local
      - langgenius/dify-sandbox:0.2.12
      - langgenius/dify-web:1.12.1
      - nginx:latest
