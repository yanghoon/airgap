kind: ZarfPackageConfig
metadata:
  name: dify
  version: 1.14.1

components:
  - name: dify-core
    required: true
    charts:
      - name: dify
        url: https://douban.github.io/charts/
        version: 0.9.0
        namespace: dify
        valuesFiles:
          - values.yaml
    files:
      - source: openai_api_compatible.difypkg
        target: openai_api_compatible.difypkg
    actions:
      onDeploy:
        after:
          - cmd: ./zarf tools kubectl wait --for=condition=ready pod -l app.kubernetes.io/component=plugin-daemon -n dify --timeout=300s
          - cmd: |
              PLUGIN_POD=$(./zarf tools kubectl get pod -n dify -l app.kubernetes.io/component=plugin-daemon -o jsonpath='{.items[0].metadata.name}')
              ./zarf tools kubectl cp openai_api_compatible.difypkg dify/${PLUGIN_POD}:/app/storage/openai_api_compatible.difypkg
              ./zarf tools kubectl rollout restart deployment dify-plugin-daemon -n dify
