apiVersion: zarf.dev/v1alpha1
kind: ZarfPackageConfig
metadata:
  name: rke2-harbor
  description: ""
  version: v0.0.1

variables:
  - name: HARBOR_DOMAIN
    description: Harbor 접속 도메인
    default: harbor.local
    prompt: true

  - name: STORAGE_CLASS
    description: 데이터 저장에 사용할 StorageClass 명칭
    default: standard
    prompt: true

  - name: S3_ENDPOINT
    description: "S3 엔드포인트 URL (예: s3.amazonaws.com 또는 minio-svc)"
    prompt: true

  - name: S3_BUCKET
    description: "Harbor 이미지를 저장할 S3 버킷 명칭"
    prompt: true

  - name: S3_ACCESS_KEY
    description: S3 Access Key
    prompt: true

  - name: S3_SECRET_KEY
    description: S3 Secret Key
    prompt: true

  - name: DB_HOST
    description: 클러스터 내부 Database 서비스 주소
    default: postgresql.harbor.svc
    prompt: true

  - name: DB_PASSWORD
    description: Postgres 'postgres' 유저 패스워드
    default: harbor 
    prompt: true

components:
  - name: rke2-images-harbor
    required: true
    actions:
      onCreate:
        before:
          - cmd: scripts/harbor/images.sh download
        # after:
        #   - cmd: scripts/harbor/images.sh clean
    files:
      - source: .tmp/goharbor-harbor-core-v2.13.5.tar
        target: /var/lib/rancher/rke2/agent/images/goharbor-harbor-core-v2.13.5.tar
      - source: .tmp/goharbor-harbor-jobservice-v2.13.5.tar
        target: /var/lib/rancher/rke2/agent/images/goharbor-harbor-jobservice-v2.13.5.tar
      - source: .tmp/goharbor-harbor-portal-v2.13.5.tar
        target: /var/lib/rancher/rke2/agent/images/goharbor-harbor-portal-v2.13.5.tar
      - source: .tmp/goharbor-harbor-registryctl-v2.13.5.tar
        target: /var/lib/rancher/rke2/agent/images/goharbor-harbor-registryctl-v2.13.5.tar
      - source: .tmp/goharbor-redis-photon-v2.13.5.tar
        target: /var/lib/rancher/rke2/agent/images/goharbor-redis-photon-v2.13.5.tar
      - source: .tmp/goharbor-registry-photon-v2.13.5.tar
        target: /var/lib/rancher/rke2/agent/images/goharbor-registry-photon-v2.13.5.tar
  
  - name: rke2-helm-harbor
    actions:
      onCreate:
        before:
          - cmd: scripts/harbor/helm_before.sh
        # after:
        #   - cmd: rm -rf .tmp
    files:
      - source: .tmp/rke2-helm-harbor.yaml
        target: /var/lib/rancher/rke2/server/manifests/rke2-helm-harbor.yaml
      - source: manifests/zarf-connect-harbor.yaml
        target: /var/lib/rancher/rke2/server/manifests/zarf-connect-harbor.yaml
  
  - name: rke2-config-registries
    files:
      - source: rke2-registries.yaml
        target: /var/lib/rancher/rke2/agent/etc/registries.yaml
  
