# Trino 1.42.1 Helm Chart 기준 최신 설정
image:
  tag: 480

ingress:
  enabled: true
  hosts:
  - host: trino.local
    paths:
      - path: /
        pathType: ImplementationSpecific

server:
  workers: 1
  node:
    environment: production
  # for dynamic catalog configuration
  coordinatorExtraConfig: |
    http-server.process-forwarded=true
    catalog.management=dynamic
    catalog.store=file
  workerExtraConfig: |
    catalog.management=dynamic

additionalLogProperties:
  - org.apache.iceberg=DEBUG
  - com.amazonaws=DEBUG
  - io.trino.server.PluginManager=WARN

coordinator:
  jvm:
    maxHeapSize: 2G
  resources:
    requests:
      cpu: 0.5
      memory: 2Gi
    limits:
      cpu: 1
      memory: 2Gi
  # for dynamic catalog configuration
  additionalConfigFiles:
    catalog-store.properties: |
      # https://github.com/trinodb/trino/issues/26443
      catalog.config-dir=/etc/trino/catalog-dynamic
  additionalVolumes:
    - name: catalog-volume-dynamic
      emptyDir: {}
  additionalVolumeMounts:
    - name: catalog-volume-dynamic
      mountPath: /etc/trino/catalog-dynamic

worker:
  jvm:
    maxHeapSize: 2G
  resources:
    requests:
      cpu: 0.5
      memory: 2Gi
    limits:
      cpu: 1
      memory: 2Gi

# for dynamic catalog configuration
sidecarContainers:
  coordinator:
  - name: catalog-sidecar
    image: kiwigrid/k8s-sidecar:1.25.2
    env:
      - name: LABEL
        value: app.kubernetes.io/component
      - name: LABEL_VALUE
        value: catalogs
      - name: RESOURCE
        value: both
      - name: FOLDER
        value: /etc/trino/catalog-dynamic
    volumeMounts:
      - name: catalog-volume-dynamic
        mountPath: /etc/trino/catalog-dynamic

