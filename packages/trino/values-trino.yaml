server:
  workers: 1

service:
  type: NodePort

env:
  - name: CATALOG_REST_URL
    value: http://iceberg-rest.iceberg.svc.cluster.local:8080
  - name: S3_ENDPOINT
    value: http://minio.iceberg.svc.cluster.local:9000
  - name: S3_ACCESS_KEY
    value: minioadmin
  - name: S3_SECRET_KEY
    value: minioadmin
  - name: S3_REGION
    value: us-east-1

catalogs:
  iceberg: |
    connector.name=iceberg

    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=${ENV:CATALOG_REST_URL}

    iceberg.allowed-extra-properties=*

    fs.native-s3.enabled=true
    s3.path-style-access=true
    s3.endpoint=${ENV:S3_ENDPOINT}
    s3.aws-access-key=${ENV:S3_ACCESS_KEY}
    s3.aws-secret-key=${ENV:S3_SECRET_KEY}
    s3.region=${ENV:S3_REGION}
