# Trino 1.42.1 Helm Chart 기준 최신 설정
image:
  tag: "480"

server:
  workers: 1
  node:
    environment: production

coordinator:
  jvm:
    maxHeapSize: "2G"
  # 2core, 8gb 환경 최적화
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "1"
      memory: "2Gi"

worker:
  jvm:
    maxHeapSize: "2G"
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "1"
      memory: "2Gi"

# 최신 차트의 catalogs 표준 포맷 사용
catalogs:
  iceberg: |-
    # https://trino.io/docs/current/connector/iceberg.html#general-configuration
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=###ZARF_VAR_ICEBERG_REST_URI###
    iceberg.rest-catalog.warehouse=s3://###ZARF_VAR_S3_HOST###/###ZARF_VAR_S3_BUCKET###/warehouse

    # Native S3 성능 가속화
    fs.native-s3.enabled=true
    s3.endpoint=###ZARF_VAR_S3_ENDPOINT###
    s3.aws-access-key=###ZARF_VAR_S3_ACCESS_KEY###
    s3.aws-secret-key=###ZARF_VAR_S3_SECRET_KEY###
    s3.path-style-access=true

    # Iceberg 480 기능 활성화
    iceberg.register-table-procedure.enabled=true
