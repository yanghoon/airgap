#type: manifest
#source: /var/folders/dg/zsns4b4x6jbcz945l3254t7w0000gp/T/zarf-791413692/trino-catalog-iceberg/manifests/trino-catalog-iceberg-0.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-catalog-iceberg
  namespace: trino
  labels:
    app.kubernetes.io/name: trino
    app.kubernetes.io/instance: trino
    app.kubernetes.io/component: catalog
    # app.kubernetes.io/part-of: trino
    # app.kubernetes.io/managed-by: zarf
    trino-catalog: "true"
data:
  iceberg.properties: |-
    # https://trino.io/docs/current/connector/iceberg.html#general-configuration
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://iceberg-rest.iceberg-system:8181
    iceberg.rest-catalog.warehouse=s3://minio.iceberg-system:9000/datalake/warehouse

    # Native S3 성능 가속화
    fs.native-s3.enabled=true
    s3.endpoint=http://minio.iceberg-system:9000
    s3.aws-access-key=minioadmin
    s3.aws-secret-key=minioadmin
    s3.path-style-access=true

    # Iceberg 480 기능 활성화
    iceberg.register-table-procedure.enabled=true
---
