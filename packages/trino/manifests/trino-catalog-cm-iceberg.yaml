apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-catalog-iceberg
  namespace: trino
  labels:
    app.kubernetes.io/name: trino
    app.kubernetes.io/instance: trino
    app.kubernetes.io/component: catalogs
    # app.kubernetes.io/part-of: trino
    # app.kubernetes.io/managed-by: zarf
    # trino-catalog: "true"
data:
  iceberg.properties: |-
    # https://trino.io/docs/current/connector/iceberg.html#general-configuration
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=###ZARF_VAR_ICEBERG_REST_URI###
    iceberg.rest-catalog.warehouse=s3://###ZARF_VAR_S3_HOST###/###ZARF_VAR_S3_BUCKET###/warehouse

    # Native S3 성능 가속화
    fs.native-s3.enabled=true
    s3.endpoint=###ZARF_VAR_S3_ENDPOINT###
    s3.aws-access-key=###ZARF_VAR_S3_ACCESS_KEY###
    s3.aws-secret-key=###ZARF_VAR_S3_SECRET_KEY###
    s3.path-style-access=true

    # Iceberg 480 기능 활성화
    iceberg.register-table-procedure.enabled=true
