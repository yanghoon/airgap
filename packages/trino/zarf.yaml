kind: ZarfPackageConfig
metadata:
  name: trino-iceberg-package
  description: "Trino 480 w/ Iceberg REST Catalog (Air-gap)"
  version: "1.42.1"

constants:
  - name: TRINO_NAMESPACE
    description: "Trino 배포 네임스페이스"
    value: "trino"

variables:
  - name: ICEBERG_REST_URI
    description: Iceberg REST Catalog URL
    default: http://iceberg-rest.iceberg-system:8181
  - name: S3_ENDPOINT
    description: "S3 (MinIO) 엔드포인트
    default: http://minio.iceberg-system:9000
  - name: S3_HOST
    description: S3 호스트 이름 (endpoint에서 호스트 부분만 추출)
    default: minio.iceberg-system:9000
  - name: S3_BUCKET
    description: S3 버킷 이름
    default: "datalake
  - name: S3_ACCESS_KEY
    description: S3 Access Key
    default: "minioadmin
  - name: S3_SECRET_KEY
    description: S3 Secret Key
    default: minioadmin
  - name: S3_REGION
    description: S3 Region
    default: us-east-1

components:
  - name: trino-cluster
    required: true
    description: "Trino Engine (v480) & Helm (v1.42.1)"
    charts:
      - name: trino
        releaseName: trino
        url: https://trinodb.github.io/charts
        version: 1.42.1
        namespace: trino
        valuesFiles:
          - values-trino.yaml
    images:
      - trinodb/trino:480
      - kiwigrid/k8s-sidecar:1.25.2

  - name: trino-sidecar-rolebinding
    required: true
    description: "RoleBinding for Trino Sidecar Container"
    manifests:
      - name: trino-sidecar-rolebinding
        files:
          - manifests/trino-sidecar-rolebinding.yaml

  - name: trino-catalog-iceberg
    description: "Trino Catalog ConfigMap for Iceberg"
    manifests:
      - name: trino-catalog-iceberg
        files:
          - manifests/trino-catalog-cm-iceberg.yaml
