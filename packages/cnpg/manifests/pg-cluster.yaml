apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: single-node-pg
  namespace: default
spec:
  instances: 1 # 1개 노드 구성
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  
  # OpenEBS LocalPV (Hostpath) 연동
  storage:
    size: 1Gi
    storageClass: openebs-hostpath
  
  # 💡 Barman Cloud 플러그인 활성화 및 ObjectStore 연결
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true # 이 클러스터에서 발생하는 WAL 파일을 위 ObjectStore로 전송하겠다는 의미
      parameters:
        barmanObjectName: minio-backup-store # 앞서 생성한 ObjectStore CR의 이름

