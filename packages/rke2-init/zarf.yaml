kind: ZarfPackageConfig
metadata:
  name: rke2-init
  description: "Zarf를 활용한 에어갭 RKE2 5노드 클러스터 자동화 구축"
  version: v1.33.10+rke2r3

variables:
  - name: RKE2_VERSION
    default: v1.33.10+rke2r3

  - name: SERVER_IP
    description: "최초 Server 노드의 IP (미입력 시 단독 서버 동작)"
    default: ""
    prompt: true

  - name: RKE2_TOKEN
    description: "최초 Server 노드 생성 토큰 (미입력 시 신규 생성)"
    default: ""
    prompt: true

components:
  - name: rke2-artifacts
    required: true
    description: "RKE2 바이너리 및 에어갭 이미지 번들링"
    files:
      - source: https://github.com/rancher/rke2/releases/download/v1.33.10+rke2r3/rke2.linux-amd64.tar.gz
        target: /tmp/rke2-artifacts/rke2.linux-amd64.tar.gz
      - source: https://github.com/rancher/rke2/releases/download/v1.33.10+rke2r3/rke2-images.linux-amd64.tar.zst
        target: /tmp/rke2-artifacts/rke2-images.linux-amd64.tar.zst
      - source: https://github.com/rancher/rke2/releases/download/v1.33.10+rke2r3/sha256sum-amd64.txt
        target: /tmp/rke2-artifacts/sha256sum-amd64.txt
      - source: https://raw.githubusercontent.com/rancher/rke2/master/install.sh
        target: /tmp/rke2-artifacts/install.sh
        executable: true

  - name: rke2-install-actions
    required: true
    description: "RKE2 서비스 등록 및 상태 검증"
    actions:
      onDeploy:
        after:
          - cmd: |
              cd /tmp/rke2-artifacts
              INSTALL_RKE2_ARTIFACT_PATH=/tmp/rke2-artifacts sh install.sh >&2
          
      onRemove:
        before:
          - cmd: /usr/local/bin/rke2-uninstall.sh

  - name: rke2-config-bootstrap
    required: true
    description: "동적 config.yaml 생성"
    files:
      - source: config.yaml.bootstrap.template
        target: /etc/rancher/rke2/config.yaml
    actions:
      onDeploy:
        after:
          - cmd: |
              echo "on Boostrap :"
              # echo "  sudo mv /etc/rancher/rke2/config.yaml.bootstrap /etc/rancher/rke2/config.yaml"
              echo "  sudo systemctl status rke2-server.service"
              echo "  sudo systemctl enable rke2-server.service"
              echo "  sudo systemctl start  rke2-server.service"
              echo "  journalctl -u rke2-server -f"
              echo
              echo "  sudo cat /var/lib/rancher/rke2/server/token  # rke2 token list"
              echo
              echo "  export KUBECONFIG=/etc/rancher/rke2/rke2.yaml"
              echo "  sudo -E zarf tools monitor"

  - name: rke2-config
    required: true
    description: "동적 config.yaml 생성"
    files:
      - source: config.yaml.template
        target: /etc/rancher/rke2/config.yaml
    actions:
      onDeploy:
        after:
          - cmd: |
              echo "on Join (Server/Agent):"
              echo "  sudo cat /var/lib/rancher/rke2/server/token  # rke2 token list"
              echo
              # echo "  sudo mv /etc/rancher/rke2/config.yaml.join /etc/rancher/rke2/config.yaml"
              echo "  sudo systemctl enable rke2-server.service"
              echo "  sudo systemctl start  rke2-server.service"
              echo
              echo "  sudo systemctl enable rke2-agent.service"
              echo "  sudo systemctl start  rke2-agent.service"
              echo
              echo "  journalctl -u rke2-server -f"
