kind: ZarfPackageConfig
metadata:
  name: rke2-airgap-provisioner
  description: "Zarf를 활용한 에어갭 RKE2 5노드 클러스터 자동화 구축"
  version: "1.0.0"

# constants:
#   - name: RKE2_VERSION
#     value: "v1.33.10+rke2r3"

variables:
  - name: RKE2_VERSION
    # default: "v1.30.2+rke2r1"
    default: "v1.33.10+rke2r3"

  - name: RKE2_ROLE
    description: "노드 역할 선택 (server / agent)"
    default: "server"
    prompt: true

  - name: SERVER_IP
    description: "최초 Server 노드의 IP (미입력 시 단독 서버 동작)"
    default: ""
    prompt: true

  - name: RKE2_TOKEN
    description: "최초 Server 노드 생성 토큰 (미입력 시 신규 생성)"
    default: ""
    prompt: true

components:
  - name: rke2-core-assets
    required: true
    description: "RKE2 바이너리 및 에어갭 이미지 번들링"
    actions:
      onCreate:
        before:
          # RKE2 토큰 생성 (미입력 시)
          - cmd: |
              echo ${ZARF_VAR_RKE2_VERSION}___${ZARF_CONST_RKE2_VERSION}___${RKE2_VERSION}___
              RKE2_VERSION="v1.33.10+rke2r3"
              mkdir -p /tmp/rke2/
              curl -sL -o /tmp/rke2/rke2.linux-amd64.tar.gz \
                "https://github.com/rancher/rke2/releases/download/${RKE2_VERSION}/rke2.linux-amd64.tar.gz"
              curl -sL -o /tmp/rke2/rke2-images.linux-amd64.tar.zst \
                "https://github.com/rancher/rke2/releases/download/${RKE2_VERSION}/rke2-images.linux-amd64.tar.zst"
              curl -sL -o /tmp/rke2/install.sh \
                "https://raw.githubusercontent.com/rancher/rke2/master/install.sh"
    files:
      # - source: "https://github.com/rancher/rke2/releases/download/###ZARF_CONST_RKE2_VERSION###/rke2.linux-amd64.tar.gz"
      - source: /tmp/rke2/rke2.linux-amd64.tar.gz
        target: /tmp/rke2.linux-amd64.tar.gz
      # - source: "https://github.com/rancher/rke2/releases/download/###ZARF_CONST_RKE2_VERSION###/rke2-images.linux-amd64.tar.zst"
      - source: /tmp/rke2/rke2-images.linux-amd64.tar.zst
        target: /var/lib/rancher/rke2/agent/images/rke2-images.linux-amd64.tar.zst
      # - source: "https://raw.githubusercontent.com/rancher/rke2/master/install.sh"
      - source: /tmp/rke2/install.sh
        target: /tmp/install.sh
        executable: true

  - name: rke2-config
    required: true
    description: "동적 config.yaml 생성"
    files:
      - source: config.yaml.template
        target: /etc/rancher/rke2/config.yaml

  - name: rke2-deploy-actions
    required: true
    description: "RKE2 서비스 등록 및 상태 검증"
    actions:
      onDeploy:
        after:
          # 바이너리 압축 해제 및 설치
          - cmd: "tar -zxvf /tmp/rke2.linux-amd64.tar.gz -C /usr/local"
          
          # 서비스 활성화 및 구동
          - cmd: |
              if [ "###ZARF_VAR_RKE2_ROLE###" = "server" ]; then
                systemctl enable --now rke2-server
              else
                systemctl enable --now rke2-agent
              fi
          
          # 노드 가용성 확인 (최초 서버 부팅 대기)
          - cmd: |
              if [ "###ZARF_VAR_RKE2_ROLE###" = "server" ]; then
                export KUBECONFIG=/etc/rancher/rke2/rke2.yaml
                /usr/local/bin/kubectl wait --for=condition=Ready nodes --all --timeout=300s
              fi
            # only:
            #   variable: RKE2_ROLE
            #   value: server
