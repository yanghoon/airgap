<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Dify Agent Sidepanel</title>
  <style>
    body { padding: 0; margin: 0; font-family: sans-serif; overflow: hidden; }
    iframe { width: 100vw; height: 100vh; border: none; }
  </style>
</head>
<body>
  <!-- Dify 에이전트 임베딩 iframe -->
  <iframe
    src="https://dify.ai/...your-agent-url"
    style="width: 100vw; height: 100vh; min-height: 700px;"
    frameborder="0">

  </iframe>

  <!-- MV3 CSP 제약 준수: 모든 인라인 스크립트를 배제하고 외부 모듈 파일 로드 -->
  <script type="module" src="main.js"></script>

  <textarea style="position: absolute; bottom: 0; left: 0; width: 100%; height: 150px; border: none; background: #f0f0f0; padding: 10px; box-sizing: border-box;">
    Dify Agent Sidepanel
    --------------------
    이 사이드패널은 Dify Agent와의 상호작용을 위해 설계되었습니다.
    여기에 에이전트의 UI가 로드되고, 사용자는 이 공간에서 에이전트와 대화하거나 정보를 확인할 수 있습니다.
  </textarea>
</body>
</html>
