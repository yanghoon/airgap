name: Build and Upload Internal Release Asset

on:
  release:
    types: [published]

jobs:
  deploy-asset:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Git Tag Format
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          if [[ ! $TAG_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ 에러: 태그 형식이 'v1.0.0' 형태가 아닙니다. ($TAG_NAME)"
            exit 1
          fi

      - name: Inject Production Version from Tag
        run: |
          TAG_VERSION=$(echo "${{ github.event.release.tag_name }}" | sed 's/^v//')
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$TAG_VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Pack Extension via WXT
        run: npx wxt zip

      - name: Commit Version Bump to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to ${{ github.event.release.tag_name }} [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push skipped"

      - name: Upload ZIP to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP_PATH=$(ls .output/*.zip | head -n 1)
          gh release upload ${{ github.event.release.tag_name }} "$ZIP_PATH" --clobber
