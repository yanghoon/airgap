services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command:
      - --config
      - /app/config.yaml
      - --detailed_debug
    ports:
      - 4000:4000
    environment:
      - LITELLM_MASTER_KEY=sk-InternalProxyMasterKey0000!
      - UI_USERNAME=admin
      - UI_PASSWORD=admin
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
