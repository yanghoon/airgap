services:
  log-generator:
    image: busybox:1.36
    volumes:
      - ./scripts/logger.sh:/entrypoint.sh
    entrypoint: >
      /bin/sh -c /entrypoint.sh
    environment:
      TEST_NAME: Exact_Count_Delay_Test
      TOTAL_COUNT: 100
      KAFKA_BROKER: my-cluster.kafka.local:443
      KAFKA_TOPIC: test-topic
      KAFKA_OPTS: >
        -X security.protocol=SSL
        -X ssl.enpoint.identification.algorithm=none -X enable.ssl.certificate.verification=0
        -d all
