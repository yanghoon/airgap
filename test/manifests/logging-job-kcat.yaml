# 1. ConfigMap: 설정 및 실행 로직
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-test-config
data:
  TEST_NAME: Exact_Count_Delay_Test
  TOTAL_COUNT: "2000" # 100건 * 0.2초 = 이론상 최소 20초 소요
  # KAFKA_BROKER: "kafka-service.namespace.svc.cluster.local:9092"
  KAFKA_BROKER: my-cluster-kafka-bootstrap.kafka-operator.svc.cluster.local:9092
  KAFKA_TOPIC: test-topic
  
  run.sh: |
    #!/bin/sh
    # awk를 사용하여 이론상 예상 소요 시간 계산
    EXPECTED_TIME=$(awk -v count="$TOTAL_COUNT" 'BEGIN { print count * 0.2 }')
    
    echo "=========================================="
    echo "테스트 시작: $TEST_NAME"
    echo "▶ 목표 전송 건수: $TOTAL_COUNT 건"
    echo "▶ 이론상 소요 시간: 최소 $EXPECTED_TIME 초 (sleep 0.2 기준)"
    echo "=========================================="
    
    # 시작 시간 측정 (나노초 단위)
    START_TIME=$(date +%s.%N)
    
    # 파이프라인을 통한 정량 로그 전송
    {
      for i in $(seq 1 $TOTAL_COUNT); do
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "$TIMESTAMP | $TEST_NAME | SEQ=$(printf "%06d" $i)"
          sleep 0.2
      done
    } | kcat -b $KAFKA_BROKER -t $KAFKA_TOPIC -P

    # kcat 종료 코드 및 종료 시간 측정
    KCAT_EXIT=$?
    END_TIME=$(date +%s.%N)

    if [ $KCAT_EXIT -eq 0 ]; then
        echo "=========================================="
        echo "Kafka 전송 및 확인(ACK) 완료"
        echo "=========================================="
        
        # 실제 소요 시간 및 최종 건수 출력 (EPS 제외)
        awk -v t1="$START_TIME" -v t2="$END_TIME" -v count="$TOTAL_COUNT" 'BEGIN {
            elapsed = t2 - t1;
            printf "▶ 최종 전송 성공 건수: %d 건\n", count;
            printf "▶ 실제 총 소요 시간  : %.3f 초\n", elapsed;
        }'
        echo "=========================================="
        exit 0
    else
        echo "Kafka 전송 중 에러가 발생했습니다."
        exit 1
    fi
---
# 2. Job: 단일 컨테이너 실행
apiVersion: batch/v1
kind: Job
metadata:
  name: exact-count-kafka-job
spec:
  ttlSecondsAfterFinished: 10
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: kafka-producer
          image: confluentinc/cp-kcat:8.1.3
          command: ["/bin/sh", "-c", "sh /config/run.sh"]
          envFrom:
            - configMapRef:
                name: kafka-test-config
          volumeMounts:
            - name: script-volume
              mountPath: /config
      volumes:
        - name: script-volume
          configMap:
            name: kafka-test-config
